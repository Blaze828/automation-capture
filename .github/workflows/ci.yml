name: Windows validation and VSIX
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python -m pip install -r python/requirements.txt
      - run: python -m py_compile python/capture.py
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: js-assignment-autocapture-vsix
          path: '*.vsix'
