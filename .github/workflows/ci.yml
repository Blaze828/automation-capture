name: Windows and Mac validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: ${{ matrix.name }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: win32-x64
          - name: Mac Apple Silicon
            os: macos-15
            target: darwin-arm64
          - name: Mac Intel
            os: macos-15-intel
            target: darwin-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python -m pip install -r python/requirements.txt
      - run: python -m compileall -q python runtime
      - name: Python tests including native Mac framework bindings
        run: python -m unittest discover -s test -p 'test_*.py' -v
      - name: Node tests including real CMD or zsh reuse
        run: npm test
      - name: Install isolated VS Code on Mac
        id: vscode
        if: runner.os == 'macOS'
        shell: bash
        run: |
          platform=darwin
          if [ "$(uname -m)" = arm64 ]; then platform=darwin-arm64; fi
          curl --fail --location --retry 3 "https://update.code.visualstudio.com/latest/$platform/stable" --output "$RUNNER_TEMP/vscode.zip"
          ditto -x -k "$RUNNER_TEMP/vscode.zip" "$RUNNER_TEMP/autocapture-vscode"
          app="$RUNNER_TEMP/autocapture-vscode/Visual Studio Code.app"
          binary=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Contents/Info.plist")
          echo "VSCODE_EXECUTABLE=$app/Contents/MacOS/$binary" >> "$GITHUB_ENV"
          echo "AUTOCAPTURE_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - name: Mac VS Code extension and terminal API integration
        if: runner.os == 'macOS'
        timeout-minutes: 5
        env:
          AUTOCAPTURE_API_ONLY: '1'
        run: npm run test:integration
      - name: Mac real window, output pagination and REPL capture
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.vscode.outcome == 'success' }}
        timeout-minutes: 6
        env:
          AUTOCAPTURE_CAPTURE_DEBUG: '1'
          AUTOCAPTURE_LAYOUT_DEBUG: ${{ github.workspace }}/.test-artifacts/macos-layout.json
        shell: bash
        run: |
          python scripts/macos_ci_dialogs.py &
          watcher=$!
          trap 'kill "$watcher" 2>/dev/null || true' EXIT
          npm run test:integration
      - name: Record Mac permissions and GUI verification receipt
        if: always() && runner.os == 'macOS'
        run: python scripts/macos_permissions.py
      - name: Capture Mac desktop on integration failure
        if: failure() && runner.os == 'macOS'
        timeout-minutes: 1
        run: screencapture -x .test-artifacts/ci-desktop.png
      - name: Build platform-specific VSIX
        run: node scripts/package.cjs ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autocapture-${{ matrix.target }}
          include-hidden-files: true
          path: |
            dist/*.vsix
            .test-artifacts/**/host.log
            .test-artifacts/**/*.png
            .test-artifacts/macos-permissions.json
            .test-artifacts/macos-layout.json
            .test-artifacts/**/gui-verification.json
