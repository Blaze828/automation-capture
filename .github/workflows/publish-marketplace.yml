name: Publish to VS Code Marketplace

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub release tag (for example v0.7.3)
        required: true
        type: string
      publish:
        description: Publish after verifying the release files
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: vscode-marketplace
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'Blaze828/automation-capture' && (github.event_name == 'workflow_dispatch' || !github.event.release.prerelease)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download and verify the three release packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Use a stable release tag such as v0.7.3."
            exit 1
          fi
          cd "$RUNNER_TEMP"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > release.json
          version="${RELEASE_TAG#v}"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir marketplace \
            --pattern "js-assignment-autocapture-$version-win32-x64.vsix" \
            --pattern "js-assignment-autocapture-$version-darwin-arm64.vsix" \
            --pattern "js-assignment-autocapture-$version-darwin-x64.vsix"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          import zipfile

          tag = os.environ["RELEASE_TAG"]
          release = json.loads(Path("release.json").read_text())
          assert release["tag_name"] == tag and not release["draft"] and not release["prerelease"]
          assets = {asset["name"]: asset for asset in release["assets"]}
          version = tag.removeprefix("v")
          for target in ("win32-x64", "darwin-arm64", "darwin-x64"):
              name = f"js-assignment-autocapture-{version}-{target}.vsix"
              path = Path("marketplace") / name
              with path.open("rb") as source:
                  digest = hashlib.file_digest(source, "sha256").hexdigest()
              assert assets[name]["digest"] == f"sha256:{digest}", f"Digest mismatch: {name}"
              with zipfile.ZipFile(path) as package:
                  manifest = ET.fromstring(package.read("extension.vsixmanifest"))
                  identity = manifest.find(".//{*}Identity").attrib
              assert identity["Publisher"].lower() == "blaze828"
              assert identity["Id"] == "js-assignment-autocapture"
              assert identity["Version"] == version and identity["TargetPlatform"] == target
              print(f"Verified {name}")
          PY

      - uses: actions/setup-node@v4
        if: github.event_name == 'release' || inputs.publish
        with:
          node-version: 22

      - name: Publish with Marketplace Trusted Publishing
        if: github.event_name == 'release' || inputs.publish
        run: |
          npm exec --yes --package=@vscode/vsce@4.1.0 -- \
            vsce publish --oidc --skip-duplicate --packagePath "$RUNNER_TEMP/marketplace/"*.vsix
